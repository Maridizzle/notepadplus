<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotepadPlus</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Source+Code+Pro:wght@400;500&family=Ubuntu+Mono:wght@400;700&family=Roboto+Mono:wght@400;500&family=Merriweather:wght@400;700&family=Lora:wght@400;700&family=Open+Sans:wght@400;600&family=Literata:wght@400;700&family=Crimson+Text:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="toolbar">
    <button id="btn-new" title="New File (Ctrl+N)">New</button>
    <button id="btn-open" title="Open File (Ctrl+O)">Open</button>
    <button id="btn-save" title="Save (Ctrl+S)">Save</button>
    <button id="btn-save-as" title="Save As (Ctrl+Shift+S)">Save As</button>
    <span class="toolbar-separator"></span>
    <button id="btn-find" title="Find (Ctrl+F)">Find</button>
    <button id="btn-replace" title="Replace (Ctrl+H)">Replace</button>
    <button id="btn-goto" title="Go to Line (Ctrl+G)">Go to</button>
    <span class="toolbar-separator"></span>
    <button id="btn-fold-all" title="Fold All">Fold All</button>
    <button id="btn-unfold-all" title="Unfold All">Unfold All</button>
    <span class="toolbar-separator"></span>
    <button id="btn-wrap" title="Toggle Word Wrap (Alt+Z)">Wrap</button>
    <button id="btn-minimap" title="Toggle Minimap">Minimap</button>
    <button id="btn-sidebar-toggle" title="Toggle Sidebar (Ctrl+B)">Sidebar</button>
    <button id="btn-zoom-in" title="Zoom In (Ctrl+=)">A+</button>
    <button id="btn-zoom-out" title="Zoom Out (Ctrl+-)">A-</button>
    <span class="toolbar-separator"></span>
    <label class="toolbar-label" for="font-select">Font:</label>
    <select id="font-select" title="Editor Font">
      <optgroup label="Code Fonts">
        <option value="'Fira Code', monospace">Fira Code</option>
        <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
        <option value="'Source Code Pro', monospace">Source Code Pro</option>
        <option value="'Roboto Mono', monospace">Roboto Mono</option>
        <option value="'Ubuntu Mono', monospace">Ubuntu Mono</option>
        <option value="'Consolas', monospace" selected>Consolas</option>
        <option value="'Cascadia Code', monospace">Cascadia Code</option>
        <option value="'Courier New', monospace">Courier New</option>
      </optgroup>
      <optgroup label="Writing Fonts">
        <option value="'Merriweather', serif">Merriweather</option>
        <option value="'Lora', serif">Lora</option>
        <option value="'Literata', serif">Literata</option>
        <option value="'Crimson Text', serif">Crimson Text</option>
        <option value="'Georgia', serif">Georgia</option>
        <option value="'Open Sans', sans-serif">Open Sans</option>
        <option value="'Verdana', sans-serif">Verdana</option>
        <option value="'Arial', sans-serif">Arial</option>
        <option value="'Times New Roman', serif">Times New Roman</option>
      </optgroup>
    </select>
    <span class="toolbar-separator"></span>
    <label class="toolbar-label" for="bg-color">BG:</label>
    <input type="color" id="bg-color" value="#282c34" title="Editor Background Color">
    <div id="bg-presets" title="Background Color Presets">
      <span class="bg-preset" data-color="#282c34" title="One Dark"></span>
      <span class="bg-preset" data-color="#1e1e1e" title="VS Dark"></span>
      <span class="bg-preset" data-color="#002b36" title="Solarized Dark"></span>
      <span class="bg-preset" data-color="#fdf6e3" title="Solarized Light"></span>
      <span class="bg-preset" data-color="#ffffff" title="White"></span>
      <span class="bg-preset" data-color="#f5f5dc" title="Beige"></span>
      <span class="bg-preset" data-color="#1a1b26" title="Tokyo Night"></span>
      <span class="bg-preset" data-color="#0d1117" title="GitHub Dark"></span>
      <span class="bg-preset" data-color="#2e3440" title="Nord"></span>
      <span class="bg-preset" data-color="#fbf1c7" title="Gruvbox Light"></span>
    </div>
    <span class="toolbar-separator"></span>
    <span id="autosave-indicator" title="Auto-save is active">Auto-save: ON</span>
    <span class="toolbar-separator"></span>
    <button id="btn-prose" title="Toggle Prose Mode for Grammarly">Prose</button>
    <button id="btn-grammar" title="Check Grammar (LanguageTool)">Grammar</button>
    <span class="toolbar-separator"></span>
    <button id="btn-compare" title="Compare Files">Compare</button>
  </div>

  <div id="tab-bar">
    <div id="tabs-container"></div>
  </div>

  <div id="main-content">
    <div id="sidebar">
      <div id="sidebar-header">
        <span id="sidebar-title">EXPLORER</span>
        <button id="btn-open-folder" title="Open Folder">Open Folder</button>
      </div>
      <div id="sidebar-tabs">
        <button class="sidebar-tab active" data-panel="file-tree">Files</button>
        <button class="sidebar-tab" data-panel="recent-files">Recent</button>
        <button class="sidebar-tab" data-panel="function-list">Functions</button>
      </div>
      <div id="file-tree" class="sidebar-panel active">
        <div id="file-tree-content">
          <div class="sidebar-placeholder">Open a folder to browse files</div>
        </div>
      </div>
      <div id="recent-files" class="sidebar-panel">
        <div id="recent-files-content">
          <div class="sidebar-placeholder">No recent files</div>
        </div>
      </div>
      <div id="function-list" class="sidebar-panel">
        <div id="function-list-content">
          <div class="sidebar-placeholder">No functions found</div>
        </div>
      </div>
    </div>
    <div id="sidebar-resize-handle"></div>
    <div id="editor-area">
      <div id="editor"></div>
      <textarea id="prose-editor" class="hidden" spellcheck="true"></textarea>
      <div class="split-gutter" id="split-gutter"></div>
      <div id="editor-split"></div>
      <div id="minimap" class="hidden">
        <canvas id="minimap-canvas"></canvas>
      </div>
    </div>
    <div id="grammar-panel" class="hidden">
      <div id="grammar-header">
        <span>GRAMMAR</span>
        <span id="grammar-status"></span>
        <button id="grammar-close" title="Close">&times;</button>
      </div>
      <div id="grammar-results"></div>
    </div>
  </div>

  <div id="search-results" class="hidden">
    <div id="search-results-header">
      <span id="search-results-title">Search results</span>
      <button id="search-results-close" title="Close">&times;</button>
    </div>
    <div id="search-results-list"></div>
  </div>

  <div id="find-files-dialog" class="dialog-overlay hidden">
    <div class="dialog-box dialog-wide">
      <label for="fif-query">Find in Files</label>
      <input type="text" id="fif-query" placeholder="Find what">
      <input type="text" id="fif-filters" placeholder="Filters, e.g. *.js *.md (blank = all files)">
      <div class="dialog-row">
        <input type="text" id="fif-dir" placeholder="Directory">
        <button type="button" id="fif-use-current">Current</button>
      </div>
      <div class="dialog-checks">
        <label><input type="checkbox" id="fif-case"> Match case</label>
        <label><input type="checkbox" id="fif-word"> Whole word</label>
        <label><input type="checkbox" id="fif-regex"> Regex</label>
        <label><input type="checkbox" id="fif-sub" checked> Sub-folders</label>
      </div>
      <div class="dialog-buttons">
        <button id="fif-ok">Find All</button>
        <button id="fif-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <div id="compare-bar" class="hidden">
    <span>Comparing:</span>
    <span class="compare-filename" id="compare-left-name">Left</span>
    <span>vs</span>
    <span class="compare-filename" id="compare-right-name">Right</span>
    <span id="compare-stats"></span>
    <button id="compare-close">Close Compare</button>
  </div>

  <div id="prose-find-bar" class="hidden">
    <input type="text" id="prose-find-input" placeholder="Find...">
    <span id="prose-find-count"></span>
    <button id="prose-find-prev" title="Previous">&uarr;</button>
    <button id="prose-find-next" title="Next">&darr;</button>
    <button id="prose-find-close" title="Close">&times;</button>
  </div>

  <div id="rename-dialog" class="dialog-overlay hidden">
    <div class="dialog-box">
      <label for="rename-input">Rename:</label>
      <input type="text" id="rename-input" placeholder="New name">
      <div class="dialog-buttons">
        <button id="rename-ok">Rename</button>
        <button id="rename-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <div id="goto-dialog" class="dialog-overlay hidden">
    <div class="dialog-box">
      <label for="goto-input">Go to Line:</label>
      <input type="number" id="goto-input" min="1" placeholder="Line number">
      <div class="dialog-buttons">
        <button id="goto-ok">Go</button>
        <button id="goto-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <div id="status-bar">
    <span id="status-file">Untitled</span>
    <span id="status-modified"></span>
    <span class="status-spacer"></span>
    <span id="status-lang">Plain Text</span>
    <span id="status-encoding">UTF-8</span>
    <span id="status-eol">CRLF</span>
    <span id="status-lines"></span>
    <span id="status-selection"></span>
    <span id="status-position">Ln 1, Col 1</span>
  </div>

  <script src="dist/bundle.js"></script>
</body>
</html>
