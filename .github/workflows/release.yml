name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            dir: .
          - os: macos-latest
            platform: mac
            dir: .
          - os: windows-latest
            platform: win7
            dir: win7
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: npm install

      - name: Inject version into package.json
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION%-win7}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Copy sources into Windows 7 build
        if: matrix.platform == 'win7'
        working-directory: win7
        run: npm run setup

      - name: Bundle with esbuild
        working-directory: ${{ matrix.dir }}
        run: npm run build

      - name: Build distributables
        working-directory: ${{ matrix.dir }}
        run: npx electron-builder --${{ matrix.platform == 'win7' && 'win' || matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            ${{ matrix.dir }}/dist/*.exe
            ${{ matrix.dir }}/dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build release pack
        shell: bash
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          cat > dist/README.txt <<EOF
          NotepadPlus $VERSION release pack
          ==================================

          Windows 10 / 11
            NotepadPlus.Setup.$VERSION.exe      installer (recommended)
            NotepadPlus.$VERSION.exe            portable, no install needed

          Windows 7 / 8 (older systems)
            NotepadPlus-Win7.Setup.$VERSION.exe installer
            NotepadPlus-Win7.$VERSION.exe       portable, no install needed

          macOS (Apple Silicon)
            NotepadPlus-$VERSION-arm64.dmg

          Installers are not code-signed, so Windows SmartScreen may show
          "Windows protected your PC". Click "More info" then "Run anyway".
          On macOS, right-click the app and choose Open the first time.

          Source and issues: https://github.com/Maridizzle/notepadplus
          EOF
          (cd dist && zip -r "../NotepadPlus-$VERSION-all.zip" .)
          mv "NotepadPlus-$VERSION-all.zip" dist/
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: NotepadPlus ${{ inputs.version || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          body: |
            Download **NotepadPlus-x.y.z-all.zip** for every installer in one file, or pick one:

            - `NotepadPlus.Setup.*.exe`: Windows 10 / 11 installer
            - `NotepadPlus.*.exe`: Windows 10 / 11 portable
            - `NotepadPlus-Win7.Setup.*.exe`: Windows 7 / 8 installer
            - `NotepadPlus-Win7.*.exe`: Windows 7 / 8 portable
            - `NotepadPlus-*-arm64.dmg`: macOS (Apple Silicon)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
